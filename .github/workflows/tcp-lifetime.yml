name: TCP connection lifetime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gadgets/trace_tcp/**'
      - '.github/workflows/tcp-lifetime.yml'

permissions:
  contents: read

concurrency:
  group: tcp-lifetime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifetime:
    name: Build and verify TCP connection lifetime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
      - name: Build the host binary
        run: make ig
      - name: Build the TCP gadget and run its kernel tests
        env:
          IG_VERIFY_IMAGE: 'false'
        run: |
          make -C gadgets trace_tcp/test-unit \
            IG="$GITHUB_WORKSPACE/ig" \
            BUILDER_IMAGE=ghcr.io/inspektor-gadget/gadget-builder@sha256:e14c69f2deaccecfe9b7bd94f00ca92bbc5fa5beba7080a2702ac73fd927d97f \
            GADGET_REPOSITORY=localhost/tcp-lifetime \
            GADGET_TAG=test
