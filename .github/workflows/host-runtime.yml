name: Host runtime checks

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
    paths:
      - 'pkg/container-collection/**'
      - '.github/workflows/host-runtime.yml'
  pull_request:
    paths:
      - 'pkg/container-collection/**'
      - '.github/workflows/host-runtime.yml'

permissions:
  contents: read

jobs:
  namespaces:
    name: Container namespace lifetime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
      - name: Check namespace ownership and runtime discovery
        run: go test -race -count=1 ./pkg/container-collection/...
      - name: Check real namespace descriptors as root
        run: |
          go test -c -race -o "$RUNNER_TEMP/container-collection.test" ./pkg/container-collection
          sudo "$RUNNER_TEMP/container-collection.test" -test.v \
            -test.run 'TestWithTracerCollection|TestRetiredNamespacesSurviveRestartsAndAreReleased'

  binary:
    name: Linux host binary (${{ matrix.arch }})
    needs: namespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
      - name: Build the standalone host binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          make ig
          mkdir -p dist
          tar --sort=name --owner=root:0 --group=root:0 -czf "dist/ig-linux-${GOARCH}.tar.gz" ig LICENSE
          git rev-parse HEAD > dist/source-commit.txt
          git describe --tags --always > dist/version.txt
          go version > dist/toolchain.txt
          sha256sum dist/ig-linux-*.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ig-linux-${{ matrix.arch }}
          path: dist/
